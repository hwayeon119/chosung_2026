<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>2026 학생 건강증진 수업 페스티벌 - 초성따라잡기 수업나눔</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- FontAwesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- Google Fonts (Noto Sans KR) -->
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700;900&display=swap" rel="stylesheet">
  <!-- QRCode.js -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <style>
    body { font-family: 'Noto Sans KR', sans-serif; background-color: #f3f4f6; }
    .badge-closed { background-color: #ef4444; color: white; }
    .badge-open { background-color: #10b981; color: white; }
  </style>
</head>
<body class="min-h-screen pb-12">

  <!-- Header -->
  <header class="bg-emerald-600 text-white shadow-lg sticky top-0 z-20">
    <div class="max-w-md mx-auto px-4 py-4 flex justify-between items-center">
      <div>
        <p class="text-xs font-semibold text-emerald-200">초등성교육수업연구회</p>
        <h1 class="text-xl font-bold">초성따라잡기 수업나눔</h1>
      </div>
      <button onclick="openQrModal()" class="bg-emerald-700 hover:bg-emerald-800 text-xs px-3 py-2 rounded-lg flex items-center gap-1.5 transition">
        <i class="fa-solid fa-qrcode text-sm"></i>
        <span>QR 코드</span>
      </button>
    </div>
  </header>

  <main class="max-w-md mx-auto px-4 pt-4 space-y-4">

    <!-- Subtitle Banner -->
    <div class="bg-white rounded-2xl p-4 shadow-sm border border-emerald-100 flex items-center justify-between">
      <div>
        <span class="text-xs font-bold text-emerald-600 bg-emerald-50 px-2 py-0.5 rounded-full">2026 학생 건강증진 수업 페스티벌</span>
        <h2 class="text-lg font-extrabold text-gray-800 mt-1">수업의 재미를 더하다 ✨</h2>
        <p class="text-xs text-gray-500 mt-0.5">행복한 보건수업을 실현하는 선생님들을 응원합니다.</p>
      </div>
      <div class="text-2xl text-emerald-500 pl-2">
        <i class="fa-solid fa-heart-pulse"></i>
      </div>
    </div>

    <!-- Notice -->
    <div class="bg-amber-50 border border-amber-200 rounded-xl p-3 text-xs text-amber-800 flex items-start gap-2">
      <i class="fa-solid fa-circle-info text-amber-500 mt-0.5 text-sm"></i>
      <div>
        <strong>안내사항</strong>: 각 수업 당 사전 예약 인원은 <strong>6명으로 제한</strong>됩니다. (6명 도달 시 마감)
      </div>
    </div>

    <!-- Timetable List -->
    <div id="sessionList" class="space-y-3">
      <!-- Session cards inserted by JS -->
    </div>

    <!-- Admin & My Reservation buttons -->
    <div class="pt-4 flex gap-2">
      <button onclick="openMyReservationModal()" class="flex-1 bg-white border border-gray-300 text-gray-700 py-2.5 rounded-xl text-xs font-semibold hover:bg-gray-50 transition">
        <i class="fa-solid fa-receipt mr-1"></i> 나의 신청 확인
      </button>
      <button onclick="openAdminModal()" class="flex-1 bg-gray-800 text-white py-2.5 rounded-xl text-xs font-semibold hover:bg-gray-900 transition">
        <i class="fa-solid fa-user-gear mr-1"></i> 연구회 명단 관리
      </button>
    </div>

  </main>

  <!-- Modal: Booking Form -->
  <div id="modalBooking" class="fixed inset-0 bg-black/50 z-50 hidden flex items-center justify-center p-4">
    <div class="bg-white rounded-2xl max-w-sm w-full p-5 shadow-xl relative animate-fade-in">
      <button onclick="closeBookingModal()" class="absolute top-4 right-4 text-gray-400 hover:text-gray-600">
        <i class="fa-solid fa-xmark text-lg"></i>
      </button>

      <h3 class="text-base font-bold text-gray-800 flex items-center gap-2 mb-1">
        <i class="fa-solid fa-paper-plane text-emerald-600"></i> 수업나눔 사전 예약
      </h3>
      <div id="bookingSessionInfo" class="bg-emerald-50 border border-emerald-100 rounded-xl p-3 text-xs text-emerald-900 mb-4">
        <!-- Session details JS -->
      </div>

      <form id="bookingForm" onsubmit="handleBookingSubmit(event)" class="space-y-3">
        <input type="hidden" id="bookingSessionId">
        <div>
          <label class="block text-xs font-semibold text-gray-700 mb-1">학교명 <span class="text-red-500">*</span></label>
          <input type="text" id="inputSchool" required placeholder="예: 태봉초등학교" class="w-full text-sm border border-gray-300 rounded-lg px-3 py-2 focus:ring-2 focus:ring-emerald-500 focus:outline-none">
        </div>
        <div>
          <label class="block text-xs font-semibold text-gray-700 mb-1">이름 <span class="text-red-500">*</span></label>
          <input type="text" id="inputName" required placeholder="예: 홍길동" class="w-full text-sm border border-gray-300 rounded-lg px-3 py-2 focus:ring-2 focus:ring-emerald-500 focus:outline-none">
        </div>

        <div class="pt-2 flex gap-2">
          <button type="button" onclick="closeBookingModal()" class="flex-1 bg-gray-100 text-gray-700 py-2.5 rounded-xl text-xs font-semibold hover:bg-gray-200">취소</button>
          <button type="submit" id="btnSubmit" class="flex-1 bg-emerald-600 text-white py-2.5 rounded-xl text-xs font-semibold hover:bg-emerald-700 flex justify-center items-center gap-1">
            <span>신청 완료</span>
          </button>
        </div>
      </form>
    </div>
  </div>

  <!-- Modal: QR Code -->
  <div id="modalQr" class="fixed inset-0 bg-black/50 z-50 hidden flex items-center justify-center p-4">
    <div class="bg-white rounded-2xl max-w-xs w-full p-5 shadow-xl text-center relative">
      <button onclick="closeQrModal()" class="absolute top-4 right-4 text-gray-400 hover:text-gray-600">
        <i class="fa-solid fa-xmark text-lg"></i>
      </button>

      <h3 class="text-base font-bold text-gray-800 mb-1">초성따라잡기 사전신청 QR</h3>
      <p class="text-xs text-gray-500 mb-4">선생님들의 현장 접수를 위한 QR코드입니다.</p>

      <div class="flex justify-center bg-gray-50 p-4 rounded-xl border border-gray-200 mb-3">
        <div id="qrcode"></div>
      </div>

      <div class="text-left mb-3">
        <label class="block text-[10px] text-gray-500 mb-1">QR 연결 웹주소(URL)</label>
        <input type="text" id="qrUrlInput" class="w-full text-xs border border-gray-300 rounded px-2 py-1" onchange="updateQrCode()">
      </div>

      <div class="flex gap-2">
        <button onclick="window.print()" class="flex-1 bg-gray-100 text-gray-700 text-xs py-2 rounded-lg font-medium hover:bg-gray-200">
          <i class="fa-solid fa-print"></i> 인쇄하기
        </button>
        <button onclick="closeQrModal()" class="flex-1 bg-emerald-600 text-white text-xs py-2 rounded-lg font-medium hover:bg-emerald-700">닫기</button>
      </div>
    </div>
  </div>

  <!-- Modal: Admin Management -->
  <div id="modalAdmin" class="fixed inset-0 bg-black/50 z-50 hidden flex items-center justify-center p-4">
    <div class="bg-white rounded-2xl max-w-md w-full p-5 shadow-xl relative max-h-[85vh] flex flex-col">
      <button onclick="closeAdminModal()" class="absolute top-4 right-4 text-gray-400 hover:text-gray-600">
        <i class="fa-solid fa-xmark text-lg"></i>
      </button>

      <h3 class="text-base font-bold text-gray-800 mb-1">연구회 명단 관리</h3>
      <p class="text-xs text-gray-500 mb-3">교시별 사전 신청자를 확인하고 관리합니다.</p>

      <div id="adminAuthArea" class="space-y-3 py-4">
        <p class="text-xs text-gray-600">관리자 비밀번호를 입력해주세요.</p>
        <div class="flex gap-2">
          <input type="password" id="adminPw" placeholder="비밀번호" class="flex-1 text-sm border border-gray-300 rounded-lg px-3 py-2">
          <button onclick="checkAdminPw()" class="bg-gray-800 text-white px-4 text-xs font-semibold rounded-lg hover:bg-gray-900">확인</button>
        </div>
      </div>

      <div id="adminContentArea" class="hidden overflow-y-auto flex-1 space-y-4 pr-1">
        <div id="adminListContainer" class="space-y-4"></div>
      </div>

      <div id="adminFooter" class="hidden pt-3 border-t mt-3 flex justify-between items-center">
        <button onclick="copyAllList()" class="text-xs text-emerald-600 font-semibold hover:underline">
          <i class="fa-solid fa-copy"></i> 전체 명단 복사
        </button>
        <button onclick="closeAdminModal()" class="bg-gray-100 text-gray-700 text-xs px-3 py-1.5 rounded-lg">닫기</button>
      </div>
    </div>
  </div>

  <!-- Modal: My Reservation -->
  <div id="modalMyReservation" class="fixed inset-0 bg-black/50 z-50 hidden flex items-center justify-center p-4">
    <div class="bg-white rounded-2xl max-w-sm w-full p-5 shadow-xl relative">
      <button onclick="closeMyReservationModal()" class="absolute top-4 right-4 text-gray-400 hover:text-gray-600">
        <i class="fa-solid fa-xmark text-lg"></i>
      </button>

      <h3 class="text-base font-bold text-gray-800 mb-3">내 신청 확인 / 취소</h3>
      <div class="space-y-2 mb-3">
        <input type="text" id="mySchool" placeholder="학교명 입력" class="w-full text-xs border border-gray-300 rounded-lg px-3 py-2">
        <input type="text" id="myName" placeholder="이름 입력" class="w-full text-xs border border-gray-300 rounded-lg px-3 py-2">
        <button onclick="searchMyReservation()" class="w-full bg-emerald-600 text-white text-xs py-2 rounded-lg font-semibold hover:bg-emerald-700">조회하기</button>
      </div>

      <div id="myReservationResult" class="space-y-2 max-h-48 overflow-y-auto text-xs"></div>
    </div>
  </div>

  <script>
    // --- Data Definitions ---
    const SESSIONS = [
      { id: 'free1', isBreak: true, time: '14:30-14:45', title: '자율시간' },
      { id: 's1', isBreak: false, num: '1교시', time: '14:45-15:00', title: '에듀테크를 활용한 성교육 수업나눔', limit: 6 },
      { id: 'free2', isBreak: true, time: '15:00-15:15', title: '자율시간' },
      { id: 's2', isBreak: false, num: '2교시', time: '15:15-15:30', title: '교육연극과 함께하는 성교육 수업나눔', limit: 6 },
      { id: 'free3', isBreak: true, time: '15:30-15:45', title: '자율시간' },
      { id: 's3', isBreak: false, num: '3교시', time: '15:45-16:00', title: '그림책으로 나누는 성교육 수업나눔', limit: 6 },
      { id: 'free4', isBreak: true, time: '16:00~~~~~', title: '자율시간' }
    ];

    let bookings = [];

    // --- Init ---
    document.addEventListener('DOMContentLoaded', () => {
      loadBookings();
      renderSessions();
      document.getElementById('qrUrlInput').value = window.location.href;
    });

    function loadBookings() {
      const saved = localStorage.getItem('chosung_bookings_2026');
      if (saved) {
        try {
          bookings = JSON.parse(saved);
        } catch (e) {
          bookings = [];
        }
      }
    }

    function saveBookings() {
      localStorage.setItem('chosung_bookings_2026', JSON.stringify(bookings));
    }

    // --- Render Functions ---
    function renderSessions() {
      const container = document.getElementById('sessionList');
      container.innerHTML = '';

      SESSIONS.forEach(item => {
        if (item.isBreak) {
          container.appendChild(createBreakCard(item));
        } else {
          container.appendChild(createSessionCard(item));
        }
      });
    }

    function createBreakCard(item) {
      const div = document.createElement('div');
      div.className = 'bg-gray-100 rounded-xl px-4 py-2.5 flex justify-between items-center text-xs text-gray-500 border border-gray-200/60';
      div.innerHTML = `
        <span class="font-medium bg-gray-200 text-gray-600 px-2 py-0.5 rounded">자율시간</span>
        <span class="font-mono text-gray-600">${item.time}</span>
      `;
      return div;
    }

    function createSessionCard(item) {
      const sessionBookings = bookings.filter(b => b.sessionId === item.id);
      const count = sessionBookings.length;
      const isClosed = count >= item.limit;

      const div = document.createElement('div');
      div.className = `bg-white rounded-2xl p-4 shadow-sm border transition relative overflow-hidden ${
        isClosed ? 'border-red-200 bg-red-50/20' : 'border-emerald-200 hover:border-emerald-400'
      }`;

      div.innerHTML = `
        <div class="flex justify-between items-start mb-2">
          <div class="flex items-center gap-2">
            <span class="px-2.5 py-1 rounded-lg text-xs font-bold ${isClosed ? 'bg-red-500 text-white' : 'bg-emerald-600 text-white'}">
              ${item.num}
            </span>
            <span class="text-xs font-mono text-gray-500"><i class="fa-regular fa-clock"></i> ${item.time}</span>
          </div>
          <span class="text-xs font-bold px-2 py-0.5 rounded-full ${
            isClosed ? 'bg-red-100 text-red-700' : 'bg-emerald-100 text-emerald-800'
          }">
            신청 ${count}/${item.limit}명
          </span>
        </div>

        <h3 class="text-sm font-bold text-gray-800 mb-3">${item.title}</h3>

        ${
          isClosed
            ? `<div class="w-full bg-gray-200 text-gray-500 font-bold text-xs py-2.5 rounded-xl text-center flex items-center justify-center gap-1">
                 <i class="fa-solid fa-lock"></i> [사전신청 마감]
               </div>`
            : `<button onclick="openBookingModal('${item.id}')" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-bold py-2.5 rounded-xl transition shadow-sm flex items-center justify-center gap-1">
                 <i class="fa-solid fa-pen-to-square"></i> 사전신청하기
               </button>`
        }
      `;

      return div;
    }

    // --- Booking Logic ---
    function openBookingModal(sessionId) {
      const session = SESSIONS.find(s => s.id === sessionId);
      if (!session) return;

      const sessionBookings = bookings.filter(b => b.sessionId === sessionId);
      if (sessionBookings.length >= session.limit) {
        alert('해당 수업은 신청이 마감되었습니다.');
        renderSessions();
        return;
      }

      document.getElementById('bookingSessionId').value = sessionId;
      document.getElementById('bookingSessionInfo').innerHTML = `
        <div class="font-bold text-emerald-800">${session.num}: ${session.title}</div>
        <div class="text-[11px] text-emerald-600 mt-0.5"><i class="fa-regular fa-clock"></i> ${session.time}</div>
      `;
      document.getElementById('inputSchool').value = '';
      document.getElementById('inputName').value = '';
      document.getElementById('modalBooking').classList.remove('hidden');
    }

    function closeBookingModal() {
      document.getElementById('modalBooking').classList.add('hidden');
    }

    function handleBookingSubmit(e) {
      e.preventDefault();

      const sessionId = document.getElementById('bookingSessionId').value;
      const school = document.getElementById('inputSchool').value.trim();
      const name = document.getElementById('inputName').value.trim();

      if (!school || !name) {
        alert('학교명과 이름을 입력해주세요.');
        return;
      }

      const session = SESSIONS.find(s => s.id === sessionId);
      const sessionBookings = bookings.filter(b => b.sessionId === sessionId);

      if (sessionBookings.length >= session.limit) {
        alert('신청하는 사이에 마감되었습니다.');
        closeBookingModal();
        renderSessions();
        return;
      }

      const newBooking = {
        id: Date.now().toString(),
        sessionId,
        school,
        name,
        createdAt: new Date().toLocaleString('ko-KR')
      };

      bookings.push(newBooking);
      saveBookings();
      renderSessions();
      closeBookingModal();

      alert(`[사전예약 완료]\n학교: ${school}\n이름: ${name}\n수업: ${session.num} (${session.title})`);
    }

    // --- QR Modal ---
    let qrInstance = null;
    function openQrModal() {
      document.getElementById('modalQr').classList.remove('hidden');
      updateQrCode();
    }

    function closeQrModal() {
      document.getElementById('modalQr').classList.add('hidden');
    }

    function updateQrCode() {
      const url = document.getElementById('qrUrlInput').value || window.location.href;
      const container = document.getElementById('qrcode');
      container.innerHTML = '';
      
      qrInstance = new QRCode(container, {
        text: url,
        width: 160,
        height: 160,
        colorDark: "#065f46",
        colorLight: "#ffffff",
        correctLevel: QRCode.CorrectLevel.H
      });
    }

    // --- My Reservation ---
    function openMyReservationModal() {
      document.getElementById('modalMyReservation').classList.remove('hidden');
      document.getElementById('myReservationResult').innerHTML = '';
    }

    function closeMyReservationModal() {
      document.getElementById('modalMyReservation').classList.add('hidden');
    }

    function searchMyReservation() {
      const school = document.getElementById('mySchool').value.trim();
      const name = document.getElementById('myName').value.trim();
      const resultContainer = document.getElementById('myReservationResult');

      if (!school || !name) {
        alert('학교명과 이름을 모두 입력해주세요.');
        return;
      }

      const myBookings = bookings.filter(b => b.school === school && b.name === name);

      if (myBookings.length === 0) {
        resultContainer.innerHTML = `<div class="text-center text-gray-500 py-3">일치하는 신청 내역이 없습니다.</div>`;
        return;
      }

      resultContainer.innerHTML = myBookings.map(b => {
        const session = SESSIONS.find(s => s.id === b.sessionId);
        return `
          <div class="bg-gray-50 p-2.5 rounded-lg border border-gray-200 flex justify-between items-center">
            <div>
              <div class="font-bold text-gray-800">${session ? session.num : ''} (${session ? session.title : ''})</div>
              <div class="text-[10px] text-gray-500">${b.school} | ${b.name}</div>
            </div>
            <button onclick="cancelBooking('${b.id}')" class="bg-red-500 text-white text-[10px] px-2 py-1 rounded hover:bg-red-600">취소</button>
          </div>
        `;
      }).join('');
    }

    // --- Admin Logic ---
    function openAdminModal() {
      document.getElementById('modalAdmin').classList.remove('hidden');
      document.getElementById('adminAuthArea').classList.remove('hidden');
      document.getElementById('adminContentArea').classList.add('hidden');
      document.getElementById('adminFooter').classList.add('hidden');
      document.getElementById('adminPw').value = '';
    }

    function closeAdminModal() {
      document.getElementById('modalAdmin').classList.add('hidden');
    }

    function checkAdminPw() {
      const pw = document.getElementById('adminPw').value;
      if (pw === '1234') {
        document.getElementById('adminAuthArea').classList.add('hidden');
        document.getElementById('adminContentArea').classList.remove('hidden');
        document.getElementById('adminFooter').classList.remove('hidden');
        renderAdminList();
      } else {
        alert('비밀번호가 올바르지 않습니다.');
      }
    }

    function renderAdminList() {
      const container = document.getElementById('adminListContainer');
      container.innerHTML = '';

      SESSIONS.filter(s => !s.isBreak).forEach(session => {
        const list = bookings.filter(b => b.sessionId === session.id);

        const card = document.createElement('div');
        card.className = 'bg-gray-50 p-3 rounded-xl border border-gray-200';
        card.innerHTML = `
          <div class="flex justify-between items-center mb-2 pb-2 border-b">
            <span class="font-bold text-xs text-gray-800">${session.num}: ${session.title}</span>
            <span class="text-xs font-semibold px-2 py-0.5 rounded ${list.length >= session.limit ? 'bg-red-100 text-red-700' : 'bg-emerald-100 text-emerald-800'}">
              ${list.length}/${session.limit}명
            </span>
          </div>
          ${
            list.length === 0
              ? `<div class="text-xs text-gray-400 text-center py-2">신청자 없음</div>`
              : `<ul class="space-y-1.5">
                  ${list.map((b, idx) => `
                    <li class="flex justify-between items-center text-xs bg-white p-2 rounded border border-gray-100">
                      <span><strong>${idx + 1}.</strong> ${b.school} - ${b.name}</span>
                      <button onclick="cancelBooking('${b.id}')" class="text-red-500 text-[10px] hover:underline">
                        <i class="fa-solid fa-trash"></i> 삭제
                      </button>
                    </li>
                  `).join('')}
                 </ul>`
          }
        `;
        container.appendChild(card);
      });
    }

    // --- Cancel / Delete Booking ---
    function cancelBooking(bookingId) {
      if (!confirm('정말 명단에서 삭제/취소하시겠습니까?')) return;

      bookings = bookings.filter(b => b.id !== bookingId);
      saveBookings();
      renderSessions();

      // Refresh opened modals if active
      if (!document.getElementById('modalAdmin').classList.contains('hidden')) {
        renderAdminList();
      }
      if (!document.getElementById('modalMyReservation').classList.contains('hidden')) {
        searchMyReservation();
      }

      alert('명단에서 삭제되었습니다.');
    }

    // --- Copy List ---
    function copyAllList() {
      let text = `[초성따라잡기 수업나눔 신청 명단]\n\n`;
      SESSIONS.filter(s => !s.isBreak).forEach(session => {
        const list = bookings.filter(b => b.sessionId === session.id);
        text += `📌 ${session.num} (${session.time}): ${session.title} [${list.length}/${session.limit}명]\n`;
        if (list.length === 0) {
          text += `  - (신청자 없음)\n`;
        } else {
          list.forEach((b, i) => {
            text += `  ${i + 1}. ${b.school} / ${b.name}\n`;
          });
        }
        text += `\n`;
      });

      navigator.clipboard.writeText(text).then(() => {
        alert('전체 명단이 클립보드에 복사되었습니다.');
      }).catch(err => {
        alert('복사에 실패했습니다.');
      });
    }
  </script>
</body>
</html>
